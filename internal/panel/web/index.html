<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV · админ-панель</title>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<header>
	<h1>IPTV · админ-панель</h1>
	<p class="hint">Страница работает поверх <code>/api/v1/admin/*</code> и использует те же учётные данные, что и загрузка страницы (HTTP Basic).</p>
	<div id="status" class="status" role="status"></div>
</header>

<main>
	<section>
		<h2>Каналы</h2>
		<table>
			<thead>
			<tr><th>ID</th><th>№</th><th>Название</th><th>Путь потока</th><th>Статус</th><th></th></tr>
			</thead>
			<tbody id="channels-body"></tbody>
		</table>
		<form id="channel-form" class="row">
			<input name="number" type="number" min="1" placeholder="№" required>
			<input name="name" type="text" placeholder="Название" required maxlength="80">
			<input name="stream_path" type="text" placeholder="/live/ch01/index.m3u8" required maxlength="200">
			<button type="submit">Добавить канал</button>
		</form>
	</section>

	<section>
		<h2>Пользователи</h2>
		<table>
			<thead>
			<tr><th>ID</th><th>Логин</th><th>Статус</th><th>Роль</th><th></th></tr>
			</thead>
			<tbody id="users-body"></tbody>
		</table>
		<form id="user-form" class="row">
			<input name="login" type="text" placeholder="Логин" required minlength="3" maxlength="32">
			<input name="password" type="password" placeholder="Пароль" required minlength="8" maxlength="64" autocomplete="new-password">
			<label><input name="is_admin" type="checkbox"> администратор</label>
			<button type="submit">Создать пользователя</button>
		</form>
	</section>

	<section>
		<h2>Подписки</h2>
		<form id="subs-form" class="row">
			<label>Пользователь
				<select name="user_id" id="subs-user"></select>
			</label>
			<button type="submit">Показать</button>
		</form>
		<table>
			<thead>
			<tr><th>Канал</th><th>Действует до</th><th>Статус</th><th></th></tr>
			</thead>
			<tbody id="subs-body"></tbody>
		</table>
		<form id="grant-form" class="row">
			<input type="hidden" name="user_id" id="grant-user">
			<select name="channel_id" id="grant-channel"></select>
			<label>Действует до
				<input name="expires_at" type="datetime-local">
			</label>
			<button type="submit">Выдать</button>
			<button type="button" id="clear-expiry">Бессрочно</button>
		</form>
	</section>

	<section>
		<h2>Кэш</h2>
		<pre id="cache-stats">—</pre>
		<button type="button" id="refresh-cache">Обновить статистику кэша</button>
	</section>
</main>

<script src="/admin/app.js" defer></script>
</body>
</html>
